name: 足彩AI综合分析

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/football-analysis.yml
      - data/football/current_issue.json
      - scripts/football_cycle.py
      - scripts/write_football_d1.py
      - scripts/check_football_production.py
      - src/football/**
      - public/football.*
      - functions/api/football-current.ts
      - migrations/0002_football_current.sql
  workflow_dispatch:
  schedule:
    # 每日北京时间 09:15、17:15、21:45 更新；与大乐透任务完全隔离。
    - cron: "15 1,9 * * *"
    - cron: "45 13 * * *"
    # 22:35 保底轮次：500 开奖 XML 约 21:31 才发布，21:45 轮次若因 GitHub 定时漂移提前执行会抓空（fc3d/pl3/pl5 新增 0 期且不报错）；本轮在数据发布一小时后再收一遍，保证开奖当晚入库。
    - cron: "35 14 * * *"

permissions:
  contents: write

concurrency:
  group: football-analysis
  cancel-in-progress: false

jobs:
  analyze-football:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
  - name: 连接 Tailscale（直达本地模型）
  uses: tailscale/github-action@v3
  with:
  authkey: ${{ secrets.TS_AUTHKEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: 生成足彩分析与AI解读
        env:
          DLT_AI_API_KEY: ${{ secrets.DLT_AI_API_KEY }}
          DLT_AI_BASE_URL: ${{ secrets.DLT_AI_BASE_URL }}
          DLT_AI_MODEL: ${{ secrets.DLT_AI_MODEL }}
        run: python scripts/football_cycle.py
      - name: 足彩模块测试
        run: python -m unittest tests.test_football_module -v
      - name: 当前期足彩写入D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # C-AI智能型出号需要 LLM 通道：write_football_d1.py 的四彩种钩子
          #（_append_lottery_updates）会调 ai_pick。复用现有 secrets，无需新建。
          DLT_AI_API_KEY: ${{ secrets.DLT_AI_API_KEY }}
          DLT_AI_BASE_URL: ${{ secrets.DLT_AI_BASE_URL }}
          DLT_AI_MODEL: ${{ secrets.DLT_AI_MODEL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置Cloudflare密钥，保留静态文件降级路径"
            exit 0
          fi
          python scripts/write_football_d1.py
          npx --yes wrangler@latest d1 execute dlt-draws --remote --file=migrations/0002_football_current.sql
          npx --yes wrangler@latest d1 execute dlt-draws --remote --file=.verify_tmp/football_current_d1.sql
      - name: 提交本期公开结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public data
          if git diff --cached --quiet; then
            echo "足彩公开结果没有变化"
            exit 0
          fi
          git commit -m "chore: 更新足彩AI分析"
          git status --porcelain
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Cloudflare生产账号检查
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置Cloudflare密钥，跳过部署"
            exit 0
          fi
          python scripts/check_cloudflare_account.py
      - name: 部署足彩页面到Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置Cloudflare密钥，跳过部署"
            exit 0
          fi
          npx --yes wrangler@latest pages deploy public --project-name dlt-assistant --branch master --commit-dirty=true
      - name: 正式站足彩与大乐透隔离验收
        run: python scripts/check_football_production.py
